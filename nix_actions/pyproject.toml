[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nix-actions"
version = "0.1.0"
description = "Nix Actions Engine - deterministic action scheduling, hardware triggers, and device APIs for the Nix ecosystem"
requires-python = ">=3.10"

[project.scripts]
nix-actions = "nix_actions.cli:main"
nix-core = "nix_core.cli:main"

[tool.setuptools.packages.find]
include = ["nix_actions*", "nix_core*"]
